<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Add It!">
<meta name="theme-color" content="#FFF4E0">
<title>Add to the Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4E0; --card:#FFFFFF; --ink:#23324A; --muted:#6B7385; --line:#F0E2C8;
  --go:#FF6B3D; --go-dark:#D9481C; --pick:#16A39A; --pick-soft:#D8F3EF; --sun:#FFC93C;
  --shadow:0 4px 0 rgba(35,50,74,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:'Fredoka','Baloo 2',ui-rounded,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}

.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px 0;min-height:72px}
.ibtn{height:52px;min-width:52px;padding:0 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:19px;font-weight:600;color:var(--ink);text-decoration:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(35,50,74,.12)}
.ibtn svg{width:24px;height:24px}
.ibtn.hide{visibility:hidden}
.steps{flex:1;display:flex;justify-content:center;gap:10px}
.steps i{width:14px;height:14px;border-radius:50%;background:#EADBC0;transition:all .25s}
.steps i.on{background:var(--go);width:34px;border-radius:8px}
.steps i.done{background:var(--pick)}

.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 20px 28px}
.screen{max-width:1080px;margin:0 auto;animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.q{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 22px;text-align:center}
.q h1{margin:0;font-size:clamp(32px,5.2vw,52px);font-weight:700;letter-spacing:-.5px;line-height:1.1}
.say{width:48px;height:48px;flex:none;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:24px;display:flex;align-items:center;justify-content:center}
.say:active{transform:translateY(3px)}
.hint{text-align:center;color:var(--muted);font-size:20px;margin:-10px 0 20px}

/* big tiles */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:18px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;
  min-height:150px;justify-content:center;transition:transform .12s;border:4px solid transparent}
.tile:active{transform:scale(.95)}
.tile .em{font-size:58px;line-height:1;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tile .lb{font-size:22px;font-weight:600;text-align:center;line-height:1.15}
.tile.on{border-color:var(--pick);background:var(--pick-soft)}

/* who */
.people{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.person{position:relative;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:22px 30px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:180px}
.person:active{transform:scale(.95)}
.person .av{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;color:#fff}
.person .nm{font-size:28px;font-weight:600}
.person .x{position:absolute;top:-10px;right:-10px;width:40px;height:40px;border-radius:50%;background:#E5484D;color:#fff;font-size:22px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.editing .person .x{display:flex}
.textlink{display:block;margin:26px auto 0;color:var(--muted);font-size:19px;text-decoration:underline;text-underline-offset:4px}

/* typing */
.field{display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:14px 18px;border:4px solid var(--pick)}
.field .em{font-size:52px;line-height:1}
.field input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:clamp(28px,4.4vw,40px);font-weight:600;padding:8px 0}
.field input::placeholder{color:#B9BFCB;font-weight:500}
.clear{width:44px;height:44px;border-radius:50%;background:#EEF0F4;font-size:22px;color:var(--muted);flex:none}

/* big go button */
.go{display:flex;align-items:center;justify-content:center;gap:12px;margin:28px auto 0;min-width:300px;height:84px;padding:0 44px;border-radius:999px;
  background:var(--go);color:#fff;font-size:32px;font-weight:700;box-shadow:0 7px 0 var(--go-dark);transition:transform .08s}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--go-dark)}
.go[disabled]{background:#D9D2C5;box-shadow:0 7px 0 #BDB4A4;color:#fff;opacity:.85}
.go.teal{background:var(--pick);box-shadow:0 7px 0 #0E7A73}
.go.soft{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-size:24px;height:68px;min-width:0}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px}
.row .go{margin:14px 0 0}

/* day picker */
.quick{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.chip{height:60px;padding:0 26px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:24px;font-weight:600;border:4px solid transparent}
.chip.on{border-color:var(--pick);background:var(--pick-soft)}
.chip:active{transform:translateY(3px)}
.month{max-width:820px;margin:0 auto;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:16px 18px 20px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead h2{margin:0;font-size:32px;font-weight:700}
.arrow{width:60px;height:60px;border-radius:50%;background:#FFF1D6;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.arrow[disabled]{opacity:.25}
.arrow svg{width:30px;height:30px}
.dows,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dows span{text-align:center;font-size:18px;font-weight:600;color:var(--muted);padding:6px 0}
.day{aspect-ratio:1/0.82;border-radius:18px;font-size:clamp(24px,3.4vw,32px);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFF8EC;border:4px solid transparent;line-height:1}
.day small{font-size:13px;font-weight:600;color:var(--go);margin-top:3px;letter-spacing:.3px}
.day.past{color:#D3CCBF;background:none}
.day.blank{background:none}
.day.wkend{background:#FFEFD2}
.day.on{background:var(--pick);color:#fff;border-color:var(--pick)}
.day.on small{color:#fff}
.day:not(.past):not(.blank):active{transform:scale(.92)}

/* time */
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:0 auto}
.time{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid transparent;min-height:150px;justify-content:center}
.time .em{font-size:54px;line-height:1}
.time .lb{font-size:26px;font-weight:600}
.time .sub{font-size:19px;color:var(--muted)}
.time.on{border-color:var(--pick);background:var(--pick-soft)}
.time:active{transform:scale(.95)}
.clock{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:22px}
.spin{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:10px 14px}
.spin b{font-size:52px;font-weight:700;min-width:84px;text-align:center;line-height:1}
.spin button{width:64px;height:48px;border-radius:14px;background:#FFF1D6;font-size:26px;font-weight:700}
.colon{font-size:52px;font-weight:700}
.ampm{display:flex;flex-direction:column;gap:10px}
.ampm button{width:96px;height:58px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:26px;font-weight:700;border:4px solid transparent}
.ampm button.on{border-color:var(--pick);background:var(--pick-soft)}

/* check card */
.ticket{max-width:640px;margin:0 auto;background:var(--card);border-radius:34px;box-shadow:0 8px 0 rgba(35,50,74,.10);overflow:hidden}
.ticket .band{height:18px;background:repeating-linear-gradient(90deg,var(--go) 0 40px,var(--sun) 40px 80px,var(--pick) 80px 120px)}
.ticket .body{padding:26px 30px 30px;text-align:center}
.ticket .big{font-size:86px;line-height:1;margin-bottom:8px}
.ticket h2{margin:0 0 16px;font-size:clamp(32px,5vw,44px);font-weight:700;line-height:1.1;word-break:break-word}
.fact{display:flex;align-items:center;justify-content:center;gap:12px;font-size:26px;font-weight:500;margin:8px 0}
.fact .k{font-size:30px}
.fact.by{color:var(--muted);font-size:21px}

/* done */
.yay{text-align:center}
.yay .big{font-size:120px;line-height:1;margin:10px 0 6px;animation:bounce 1s ease 2}
@keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.yay h1{margin:0 0 10px;font-size:clamp(38px,6vw,60px);font-weight:700}
.yay p{font-size:24px;color:var(--muted);margin:0 0 10px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}

/* message box */
.msg{position:fixed;inset:0;background:rgba(35,50,74,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.msg.on{display:flex}
.msg .box{background:var(--card);border-radius:32px;padding:30px 32px;max-width:560px;width:100%;text-align:center;animation:pop .3s}
.msg .big{font-size:80px;line-height:1}
.msg h2{margin:10px 0 8px;font-size:34px}
.msg p{font-size:22px;color:var(--muted);margin:0 0 6px}
.busy{position:fixed;inset:0;background:rgba(255,244,224,.82);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:9;font-size:30px;font-weight:600}
.busy.on{display:flex}
.busy .rocket{font-size:90px;animation:fly 1s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* grown-up setup */
.setup{max-width:560px;margin:0 auto;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:26px 28px;text-align:center}
.setup h1{font-size:34px;margin:0 0 6px}
.setup p{font-size:20px;color:var(--muted);margin:0 0 18px}
.setup input{width:100%;height:68px;border-radius:20px;border:3px solid var(--line);text-align:center;font-size:34px;font-weight:600;letter-spacing:8px;outline:none;background:#FFFBF3}
.setup input.url{font-size:17px;letter-spacing:0;height:56px;margin-bottom:12px}
.setup input:focus{border-color:var(--pick)}
.setup .err{color:#D9381E;font-size:19px;min-height:26px;margin-top:10px}

/* the big wall iPad: fill the screen */
@media (min-width:1100px) and (min-height:860px){
  .q{margin:18px 0 30px}
  .grid{gap:22px}
  .tile{min-height:218px;border-radius:32px}
  .tile .em{width:124px;height:124px;font-size:78px}
  .tile .lb{font-size:28px}
  .times{max-width:1040px;gap:22px}
  .time{min-height:220px}
  .time .em{font-size:76px}
  .time .lb{font-size:32px}
  .time .sub{font-size:22px}
  .month{max-width:900px}
  .day{aspect-ratio:1/0.72}
  .ticket{max-width:720px}
  .ticket .big{font-size:110px}
  .fact{font-size:30px}
  .person{min-width:220px}
  .person .av{width:120px;height:120px;font-size:60px}
  .person .nm{font-size:32px}
}
@media (max-width:820px){
  .grid{grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{min-height:128px}
  .tile .em{width:72px;height:72px;font-size:46px}
  .tile .lb{font-size:19px}
  .times{grid-template-columns:repeat(2,1fr);gap:12px}
  .time{min-height:120px}
}
@media (max-width:520px){
  .top{padding:10px 14px 0;min-height:62px}
  .stage{padding:6px 14px 24px}
  .ibtn{height:46px;min-width:46px;padding:0 12px;font-size:17px}
  .ibtn .wide{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
  .q h1{font-size:30px}
  .say{width:42px;height:42px;font-size:20px}
  .person{min-width:140px;padding:16px 18px}
  .person .av{width:72px;height:72px;font-size:36px}
  .person .nm{font-size:23px}
  .go{min-width:0;width:100%;height:74px;font-size:28px}
  .row .go.soft{width:100%}
  .chip{height:52px;padding:0 18px;font-size:20px}
  .month{padding:10px 8px 14px;border-radius:24px}
  .mhead h2{font-size:24px}
  .arrow{width:50px;height:50px}
  .dows,.days{gap:4px}
  .dows span{font-size:14px}
  .day{border-radius:12px;font-size:21px;border-width:3px}
  .day small{font-size:10px}
  .spin b{font-size:40px;min-width:60px}
  .colon{font-size:40px}
  .ticket .big{font-size:70px}
  .fact{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="ibtn" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="wide">Back</span></button>
    <div class="steps" id="steps" aria-hidden="true"></div>
    <a class="ibtn" id="home" href="index.html" aria-label="Back to the calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="wide">Calendar</span></a>
  </div>
  <main class="stage" id="stage"></main>
</div>
<div class="busy" id="busy"><div class="rocket">🚀</div><div>Sending it to the calendar…</div></div>
<div class="msg" id="msg"><div class="box" id="msgBox"></div></div>
<canvas id="confetti"></canvas>

<script>
(function () {
  'use strict';

  // ---------- saved settings (shared with the wall page) ----------
  var P = new URLSearchParams(location.search);
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem('wc_' + k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('wc_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  // a setup link can carry the relay address and family code; save them and tidy the address bar
  if (P.get('src')) store.set('src', P.get('src'));
  if (P.get('code')) store.set('kidcode', P.get('code'));
  var FROM_WALL = P.get('from') === 'wall';
  // The setup link stays in the address bar on purpose: an iPhone/iPad home-screen icon keeps its own
  // separate storage and starts from whatever address was showing when it was added.
  var SRC = store.get('src');
  var $ = function (id) { return document.getElementById(id); };

  // ---------- what can happen ----------
  var THINGS = [
    { em: '🎂', lb: 'Birthday party', bg: '#FFE3E8', mins: 120 },
    { em: '🧸', lb: 'Playdate', bg: '#FFF0C9', mins: 120 },
    { em: '⚽', lb: 'Sports', bg: '#DDF4DC', mins: 60 },
    { em: '🏊', lb: 'Swimming', bg: '#D7EEFF', mins: 60 },
    { em: '🏕️', lb: 'Adventure club', bg: '#E4F2D5', mins: 120 },
    { em: '🎮', lb: 'Game night', bg: '#E8E1FF', mins: 120 },
    { em: '🍿', lb: 'Movie night', bg: '#FFE6D5', mins: 120 },
    { em: '🍕', lb: 'Pizza night', bg: '#FFE0CC', mins: 60 },
    { em: '🎨', lb: 'Arts & crafts', bg: '#FCE1F4', mins: 60 },
    { em: '🚗', lb: 'Trip', bg: '#DCEBF7', mins: 180 },
    { em: '👵', lb: 'Family visit', bg: '#F3E6D8', mins: 120 },
    { em: '⭐', lb: 'Something else', bg: '#FFF3B8', mins: 60, blank: true }
  ];
  var TIMES = [
    { k: 'allday', em: '☀️', lb: 'All day', sub: 'No special time' },
    { k: '09:00', em: '🌅', lb: 'Morning', sub: '9:00 AM' },
    { k: '12:00', em: '🥪', lb: 'Lunchtime', sub: '12:00 PM' },
    { k: '15:00', em: '🌤️', lb: 'Afternoon', sub: '3:00 PM' },
    { k: '18:00', em: '🌙', lb: 'Evening', sub: '6:00 PM' },
    { k: 'pick', em: '🕐', lb: 'Pick a time', sub: 'Exactly when?' }
  ];
  var COLORS = ['#FF6B3D', '#16A39A', '#7A5AF8', '#E8467C', '#2D8CEB', '#F2A900', '#3FA34D'];
  var DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var ORDER = ['who', 'what', 'name', 'day', 'time', 'check'];

  // ---------- state ----------
  var S = { screen: 'who', who: '', thing: null, title: '', date: null, time: '', pick: { h: 3, m: 0, pm: true }, view: null, editing: false, typingName: false, lastId: null, lastAt: 0 };

  // ---------- date helpers ----------
  function sod(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseYmd(s) { var a = s.split('-'); return new Date(+a[0], a[1] - 1, +a[2]); }
  function today() { return sod(new Date()); }
  function dayWords(s) {
    var d = parseYmd(s), t = today(), diff = Math.round((d - t) / 864e5);
    var base = DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate();
    return diff === 0 ? 'Today! ' + base : diff === 1 ? 'Tomorrow, ' + base : base;
  }
  function timeWords(k) {
    if (!k || k === 'allday') return 'All day';
    var h = +k.slice(0, 2), m = k.slice(3);
    return ((h % 12) || 12) + ':' + m + (h < 12 ? ' AM' : ' PM');
  }
  function pickedTime() { var p = S.pick, h = p.h % 12 + (p.pm ? 12 : 0); return String(h).padStart(2, '0') + ':' + String(p.m).padStart(2, '0'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ---------- names on this device ----------
  function names() { var n = store.get('kidnames'); return Array.isArray(n) ? n : []; }
  function saveName(n) { var list = names().filter(function (x) { return x.toLowerCase() !== n.toLowerCase(); }); list.unshift(n); store.set('kidnames', list.slice(0, 8)); }
  function colorFor(n) { var h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }

  // ---------- read the question out loud ----------
  function sayBtn(text) { return 'speechSynthesis' in window ? '<button class="say" data-say="' + esc(text) + '" aria-label="Read it to me">🔊</button>' : ''; }
  function speak(text) {
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.pitch = 1.1; speechSynthesis.speak(u); } catch (e) {}
  }
  function q(text, spoken) { return '<div class="q"><h1>' + text + '</h1>' + sayBtn(spoken || text) + '</div>'; }

  // ---------- screens ----------
  function render() {
    var sc = S.screen, html = '';
    var idx = ORDER.indexOf(sc);
    $('steps').innerHTML = idx < 0 ? '' : ORDER.map(function (_, i) { return '<i class="' + (i === idx ? 'on' : i < idx ? 'done' : '') + '"></i>'; }).join('');
    $('back').classList.toggle('hide', !(idx > 0 || (sc === 'who' && S.typingName && names().length)));
    $('home').href = 'index.html';

    if (sc === 'setup') html = setupScreen();
    else if (sc === 'who') html = whoScreen();
    else if (sc === 'what') html = whatScreen();
    else if (sc === 'name') html = nameScreen();
    else if (sc === 'day') html = dayScreen();
    else if (sc === 'time') html = timeScreen();
    else if (sc === 'check') html = checkScreen();
    else if (sc === 'done') html = doneScreen();
    $('stage').innerHTML = '<div class="screen">' + html + '</div>';
    $('stage').scrollTop = 0;
    var f = $('stage').querySelector('input[autofocus]');
    if (f) setTimeout(function () { f.focus(); var v = f.value; f.value = ''; f.value = v; }, 60);
  }

  function setupScreen() {
    return '<div class="setup"><div style="font-size:64px">🔐</div><h1>Grown-up setup</h1>' +
      '<p>Type the family code once and this ' + (/iPad|iPhone|iPod/.test(navigator.userAgent) ? 'device' : 'browser') + ' will remember it.</p>' +
      (SRC ? '' : '<input class="url" id="srcIn" type="url" placeholder="Relay link (ends in /exec)" autocomplete="off" autocapitalize="off">') +
      '<input id="codeIn" type="tel" inputmode="numeric" maxlength="12" placeholder="••••••" autocomplete="off"' + (SRC ? ' autofocus' : '') + '>' +
      '<div class="err" id="setupErr"></div>' +
      '<button class="go teal" data-act="setup" style="margin-top:10px">Unlock</button></div>';
  }

  function whoScreen() {
    var list = names();
    if (!list.length || S.typingName) {
      return q('What’s your name?') +
        '<div class="field"><span class="em">👋</span><input id="nameIn" maxlength="20" autocomplete="off" autocapitalize="words" placeholder="Type your name" autofocus enterkeyhint="next"></div>' +
        '<button class="go" data-act="name-ok">That’s me!</button>';
    }
    return q('Who’s adding?') +
      '<div class="people' + (S.editing ? ' editing' : '') + '">' + list.map(function (n) {
        return '<button class="person" data-act="who" data-n="' + esc(n) + '"><span class="av" style="background:' + colorFor(n) + '">' + esc(n.charAt(0).toUpperCase()) + '</span><span class="nm">' + esc(n) + '</span>' +
          '<span class="x" data-act="forget" data-n="' + esc(n) + '" aria-label="Remove ' + esc(n) + '">✕</span></button>';
      }).join('') +
      '<button class="person" data-act="new-name"><span class="av" style="background:#E9DFCB;color:var(--ink)">+</span><span class="nm">Someone new</span></button></div>' +
      '<button class="textlink" data-act="edit-names">' + (S.editing ? 'Done' : 'Edit names') + '</button>';
  }

  function whatScreen() {
    return q('What’s happening?', 'What’s happening? Pick a picture.') +
      '<div class="grid">' + THINGS.map(function (t, i) {
        return '<button class="tile' + (S.thing === i ? ' on' : '') + '" data-act="thing" data-i="' + i + '"><span class="em" style="background:' + t.bg + '">' + t.em + '</span><span class="lb">' + t.lb + '</span></button>';
      }).join('') + '</div>';
  }

  function nameScreen() {
    var t = THINGS[S.thing];
    return q(t.blank ? 'What is it?' : 'What should we call it?', t.blank ? 'What is it? Type it in.' : 'What should we call it? You can change the words.') +
      (t.blank ? '' : '<p class="hint">You can add more, like whose party it is.</p>') +
      '<div class="field"><span class="em">' + t.em + '</span><input id="titleIn" maxlength="50" autocomplete="off" autocapitalize="sentences" placeholder="Type it here" value="' + esc(S.title) + '" autofocus enterkeyhint="next">' +
      '<button class="clear" data-act="clear" aria-label="Clear">✕</button></div>' +
      '<button class="go" data-act="title-ok" id="titleOk"' + (S.title.trim() ? '' : ' disabled') + '>Looks good →</button>';
  }

  function dayScreen() {
    var t = today(), v = S.view || new Date(t.getFullYear(), t.getMonth(), 1);
    S.view = v;
    var first = new Date(v.getFullYear(), v.getMonth(), 1), lead = first.getDay();
    var count = new Date(v.getFullYear(), v.getMonth() + 1, 0).getDate();
    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<span class="day blank"></span>';
    for (var d = 1; d <= count; d++) {
      var day = new Date(v.getFullYear(), v.getMonth(), d), key = ymd(day), past = day < t, wk = day.getDay() === 0 || day.getDay() === 6;
      cells += past ? '<span class="day past">' + d + '</span>' :
        '<button class="day' + (wk ? ' wkend' : '') + (S.date === key ? ' on' : '') + '" data-act="day" data-d="' + key + '">' + d + (+day === +t ? '<small>TODAY</small>' : '') + '</button>';
    }
    var sat = addDays(t, (6 - t.getDay() + 7) % 7 || 7);
    var quick = [['Today', ymd(t)], ['Tomorrow', ymd(addDays(t, 1))], ['Saturday', ymd(sat)]];
    var atStart = v.getFullYear() === t.getFullYear() && v.getMonth() === t.getMonth();
    var atEnd = (v.getFullYear() - t.getFullYear()) * 12 + v.getMonth() - t.getMonth() >= 12;
    return q('What day?', 'What day? Tap the day.') +
      '<div class="quick">' + quick.map(function (x) { return '<button class="chip' + (S.date === x[1] ? ' on' : '') + '" data-act="day" data-d="' + x[1] + '">' + x[0] + '</button>'; }).join('') + '</div>' +
      '<div class="month"><div class="mhead"><button class="arrow" data-act="month" data-n="-1"' + (atStart ? ' disabled' : '') + ' aria-label="Last month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>' +
      '<h2>' + MON[v.getMonth()] + (v.getFullYear() !== t.getFullYear() ? ' ' + v.getFullYear() : '') + '</h2>' +
      '<button class="arrow" data-act="month" data-n="1"' + (atEnd ? ' disabled' : '') + ' aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>' +
      '<div class="dows"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>' +
      '<div class="days">' + cells + '</div></div>';
  }

  function timeScreen() {
    var picking = S.time === 'pick';
    var html = q('What time?') + '<div class="times">' + TIMES.map(function (x) {
      return '<button class="time' + (S.time === x.k ? ' on' : '') + '" data-act="time" data-k="' + x.k + '"><span class="em">' + x.em + '</span><span class="lb">' + x.lb + '</span><span class="sub">' + x.sub + '</span></button>';
    }).join('') + '</div>';
    if (picking) {
      var p = S.pick;
      html += '<div class="clock">' +
        '<div class="spin"><button data-act="hr" data-n="1" aria-label="Later hour">▲</button><b>' + ((p.h % 12) || 12) + '</b><button data-act="hr" data-n="-1" aria-label="Earlier hour">▼</button></div>' +
        '<span class="colon">:</span>' +
        '<div class="spin"><button data-act="min" data-n="1" aria-label="More minutes">▲</button><b>' + String(p.m).padStart(2, '0') + '</b><button data-act="min" data-n="-1" aria-label="Fewer minutes">▼</button></div>' +
        '<div class="ampm"><button class="' + (p.pm ? '' : 'on') + '" data-act="ampm" data-v="am">AM</button><button class="' + (p.pm ? 'on' : '') + '" data-act="ampm" data-v="pm">PM</button></div></div>' +
        '<button class="go" data-act="pick-ok">' + timeWords(pickedTime()) + ' →</button>';
    }
    return html;
  }

  function checkScreen() {
    var t = THINGS[S.thing], tm = S.time === 'pick' ? pickedTime() : S.time;
    return q('Does this look right?') +
      '<div class="ticket"><div class="band"></div><div class="body"><div class="big">' + t.em + '</div><h2>' + esc(S.title) + '</h2>' +
      '<div class="fact"><span class="k">📅</span>' + esc(dayWords(S.date)) + '</div>' +
      '<div class="fact"><span class="k">⏰</span>' + timeWords(tm) + '</div>' +
      '<div class="fact by">Added by ' + esc(S.who) + '</div></div></div>' +
      '<div class="row"><button class="go soft" data-act="restart">Start over</button><button class="go" data-act="send" id="sendBtn">Add it! 🎉</button></div>';
  }

  function doneScreen() {
    var canUndo = S.lastId && Date.now() - S.lastAt < 25 * 60e3;
    return '<div class="yay"><div class="big">🎉</div><h1>It’s on the calendar!</h1>' +
      '<p>' + esc(S.title) + ' · ' + esc(dayWords(S.date).replace('Today! ', 'Today, ')) + '</p>' +
      '<p>It’ll show up on the wall in a few minutes.</p>' +
      '<div class="row"><button class="go teal" data-act="another">➕ Add another</button><a class="go soft" href="index.html" style="text-decoration:none">📅 See the calendar</a></div>' +
      (canUndo ? '<button class="textlink" data-act="undo">Oops! Take it back</button>' : '') + '</div>';
  }

  // ---------- talking to the relay ----------
  function post(body) {
    body.code = store.get('kidcode') || '';
    return fetch(SRC, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function busy(on, text) { $('busy').classList.toggle('on', on); if (text) $('busy').lastElementChild.textContent = text; }
  function message(big, title, text, btn, act) {
    $('msgBox').innerHTML = '<div class="big">' + big + '</div><h2>' + title + '</h2><p>' + text + '</p><button class="go teal" data-act="' + (act || 'msg-ok') + '">' + (btn || 'OK') + '</button>';
    $('msg').classList.add('on');
  }
  function problem(res) {
    var e = res && res.error;
    if (e === 'code') { S.screen = 'setup'; render(); setErr('That code didn’t work. Ask a grown-up.'); return; }
    if (e === 'limit') return message('🙈', 'Whoa, that’s a lot!', 'The calendar got lots of new things today. Ask a grown-up to help add more.');
    if (e === 'date') return message('📅', 'Pick another day', 'That day is too far away or already over.', 'Choose a day', 'goto-day');
    if (e === 'locked') return message('🔒', 'Can’t take it back here', 'Ask a grown-up to remove it in Google Calendar.');
    return message('🛰️', 'The calendar didn’t answer', 'Check the Wi-Fi and try again.', 'OK');
  }
  function setErr(t) { var e = $('setupErr'); if (e) e.textContent = t; }

  function send() {
    var btn = $('sendBtn'); if (btn) btn.disabled = true;
    var t = THINGS[S.thing], tm = S.time === 'pick' ? pickedTime() : S.time;
    busy(true, 'Sending it to the calendar…');
    post({ action: 'add', title: t.em + ' ' + S.title.trim(), date: S.date, time: tm === 'allday' ? '' : tm, minutes: t.mins, by: S.who })
      .then(function (res) {
        busy(false);
        if (!res || !res.ok) { if (btn) btn.disabled = false; return problem(res); }
        S.lastId = res.id; S.lastAt = Date.now();
        S.screen = 'done'; render(); confetti();
      })
      .catch(function () { busy(false); if (btn) btn.disabled = false; problem(null); });
  }

  function undo() {
    busy(true, 'Taking it back…');
    post({ action: 'undo', id: S.lastId }).then(function (res) {
      busy(false);
      if (!res || !res.ok) return problem(res);
      S.lastId = null;
      message('👍', 'All gone', 'It’s off the calendar.', 'OK', 'after-undo');
    }).catch(function () { busy(false); problem(null); });
  }

  function unlock() {
    var code = ($('codeIn').value || '').replace(/\D/g, ''), srcIn = $('srcIn');
    if (srcIn) {
      var u = srcIn.value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)) { setErr('Paste the relay link first.'); return; }
      SRC = u; store.set('src', u);
    }
    if (!code) { setErr('Type the code.'); return; }
    store.set('kidcode', code);
    busy(true, 'Checking…');
    post({ action: 'check' }).then(function (res) {
      busy(false);
      if (res && res.ok) { S.screen = 'who'; render(); }
      else { store.set('kidcode', null); setErr('That code didn’t work.'); var b = document.querySelector('.setup'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
    }).catch(function () { busy(false); setErr('Couldn’t reach the calendar. Check the Wi-Fi.'); });
  }

  // ---------- taps ----------
  function go(screen) { S.screen = screen; render(); }
  function next() { var i = ORDER.indexOf(S.screen); go(ORDER[Math.min(i + 1, ORDER.length - 1)]); }

  document.addEventListener('click', function (ev) {
    var sayEl = ev.target.closest('[data-say]');
    if (sayEl) { speak(sayEl.getAttribute('data-say')); return; }
    var el = ev.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'forget') {
      ev.stopPropagation();
      var n = el.getAttribute('data-n');
      store.set('kidnames', names().filter(function (x) { return x !== n; }));
      if (!names().length) S.editing = false;
      render(); return;
    }
    switch (act) {
      case 'setup': unlock(); break;
      case 'who': if (S.editing) return; S.who = el.getAttribute('data-n'); saveName(S.who); next(); break;
      case 'new-name': S.typingName = true; S.editing = false; render(); break;
      case 'edit-names': S.editing = !S.editing; render(); break;
      case 'name-ok': {
        var v = ($('nameIn').value || '').replace(/\s+/g, ' ').trim();
        if (!v) { var f = $('nameIn').parentNode; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); return; }
        v = v.charAt(0).toUpperCase() + v.slice(1);
        saveName(v); S.who = v; S.typingName = false; next(); break;
      }
      case 'thing': {
        var i = +el.getAttribute('data-i');
        if (S.thing !== i) S.title = THINGS[i].blank ? '' : THINGS[i].lb;
        S.thing = i; next(); break;
      }
      case 'clear': S.title = ''; $('titleIn').value = ''; $('titleOk').disabled = true; $('titleIn').focus(); break;
      case 'title-ok': if (S.title.trim()) next(); break;
      case 'day': S.date = el.getAttribute('data-d'); var d = parseYmd(S.date); S.view = new Date(d.getFullYear(), d.getMonth(), 1); render(); setTimeout(next, 260); break;
      case 'month': S.view = new Date(S.view.getFullYear(), S.view.getMonth() + (+el.getAttribute('data-n')), 1); render(); break;
      case 'time': {
        var k = el.getAttribute('data-k');
        S.time = k;
        if (k === 'pick') { render(); setTimeout(function () { var c = document.querySelector('.clock'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50); }
        else { render(); setTimeout(next, 220); }
        break;
      }
      case 'hr': S.pick.h = ((S.pick.h % 12) + (+el.getAttribute('data-n')) + 12) % 12 || 12; render(); scrollClock(); break;
      case 'min': S.pick.m = (S.pick.m + 15 * (+el.getAttribute('data-n')) + 60) % 60; render(); scrollClock(); break;
      case 'ampm': S.pick.pm = el.getAttribute('data-v') === 'pm'; render(); scrollClock(); break;
      case 'pick-ok': next(); break;
      case 'send': send(); break;
      case 'restart': S.thing = null; S.title = ''; S.date = null; S.time = ''; go('what'); break;
      case 'another': S.thing = null; S.title = ''; S.date = null; S.time = ''; S.lastId = null; go('what'); break;
      case 'undo': undo(); break;
      case 'after-undo': $('msg').classList.remove('on'); S.screen = 'check'; render(); break;
      case 'goto-day': $('msg').classList.remove('on'); go('day'); break;
      case 'msg-ok': $('msg').classList.remove('on'); break;
    }
  });
  function scrollClock() { var c = document.querySelector('.clock'); if (c) c.scrollIntoView({ block: 'center' }); }

  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'titleIn') { S.title = ev.target.value; $('titleOk').disabled = !S.title.trim(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var id = ev.target.id;
    if (id === 'nameIn') document.querySelector('[data-act=name-ok]').click();
    if (id === 'titleIn' && S.title.trim()) next();
    if (id === 'codeIn' || id === 'srcIn') unlock();
  });
  $('back').addEventListener('click', function () {
    if (S.screen === 'who' && S.typingName) { S.typingName = false; render(); return; }
    var i = ORDER.indexOf(S.screen);
    if (S.screen === 'done') return go('what');
    if (i > 0) go(ORDER[i - 1]);
  });

  // on the wall, wander back to the calendar if nobody is using this page
  if (FROM_WALL) {
    var idle = null;
    var poke = function () { clearTimeout(idle); idle = setTimeout(function () { location.href = 'index.html'; }, 3 * 60e3); };
    ['pointerdown', 'keydown', 'input'].forEach(function (t) { document.addEventListener(t, poke, true); });
    poke();
  }

  // ---------- confetti ----------
  function confetti() {
    var c = $('confetti'), x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
    var cols = ['#FF6B3D', '#FFC93C', '#16A39A', '#7A5AF8', '#E8467C', '#2D8CEB'];
    var bits = [];
    for (var i = 0; i < 160; i++) bits.push({ x: W / 2 + (Math.random() - .5) * 120, y: H * .45, vx: (Math.random() - .5) * 18, vy: -Math.random() * 20 - 6,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6, c: cols[i % cols.length] });
    var t0 = performance.now();
    (function frame(now) {
      x.clearRect(0, 0, W, H);
      bits.forEach(function (b) { b.vy += .5; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillStyle = b.c; x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); x.restore(); });
      if (now - t0 < 3200) requestAnimationFrame(frame); else x.clearRect(0, 0, W, H);
    })(t0);
  }

  // ---------- start ----------
  if (!SRC || !store.get('kidcode')) S.screen = 'setup';
  else if (names().length === 1) { S.who = names()[0]; }
  render();
})();
</script>
</body>
</html>
