<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family">
<title>Family Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1; --card:#FFFFFF; --ink:#18201C; --muted:#5A6660; --faint:#8A958F; --line:#E3E8E4;
  --accent:#2F6F5E; --warm:#C8642F;
  --nbg:#0B0F0D; --nink:#B7C6BF; --ntext:#9FB0A8; --nmuted:#7E8F87; --nline:#222B27;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Figtree',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body.is-night{background:var(--nbg)}
p,h1,h2,ul{margin:0;padding:0}
ul{list-style:none}
svg{display:block}
#stage{position:absolute;left:50%;top:50%;width:1366px;height:1024px;transform-origin:50% 50%}
body.portrait #stage{width:1024px;height:1366px}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}

/* ---------- day ---------- */
#day{flex-direction:column;gap:28px;padding:44px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.kicker{font-size:22px;font-weight:600;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
h1{font-size:72px;font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.hright{display:flex;align-items:flex-end;gap:24px}
.pill{margin-bottom:12px;padding:8px 16px;border-radius:999px;background:#FBE7D6;color:#8A3D12;font-size:18px;font-weight:600;white-space:nowrap}
.pill:empty{display:none}
.clock{font-size:96px;font-weight:700;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock small{font-size:32px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
main{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px}
.left{display:flex;flex-direction:column;gap:20px;min-height:0}
.card{background:var(--card);border-radius:24px;padding:26px}
.wx{display:flex;flex-direction:column;gap:20px}
.wxnow{display:flex;align-items:center;gap:20px}
.wxnow svg{width:76px;height:76px;flex:none}
.temp{font-size:68px;font-weight:700;line-height:1}
.sub{font-size:22px;color:var(--muted)}
.wxage{font-size:16px;font-weight:600;color:#B5452B}
.hours{padding-top:16px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hours li{display:flex;flex-direction:column;align-items:center;gap:4px}
.hours span{font-size:18px;color:var(--muted)}
.hours b{font-size:24px;font-weight:600}
.hours svg{width:30px;height:30px}
.today{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;overflow:hidden}
h2{font-size:28px;font-weight:700}
#todayList{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0;overflow:hidden}
.tlist{display:flex;flex-direction:column;gap:16px}
.tlist li{display:flex;gap:16px;align-items:stretch}
.tlist li.past{opacity:.4}
.bar{width:7px;border-radius:4px;flex:none}
.tlist .t{font-size:20px;color:var(--muted)}
.tlist .n{font-size:30px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.now{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;letter-spacing:.06em;vertical-align:2px}
.alldays{display:flex;flex-wrap:wrap;gap:10px}
.empty{font-size:22px;color:var(--muted)}
.more{font-size:18px;font-weight:600;color:var(--muted)}
.week{display:flex;flex-direction:column;gap:14px;min-height:0}
.weekhead{display:flex;justify-content:space-between;align-items:center;margin-top:-8px}
.dots{display:flex;gap:10px;align-items:center;min-height:56px}
.dots i{width:10px;height:10px;border-radius:50%;background:#C9D1CC;transition:background .2s,width .2s}
.dots i.on{width:28px;border-radius:5px;background:var(--accent)}
.dots.many{gap:6px}
.dots.many i{width:8px;height:8px}
.dots.many i.on{width:22px;border-radius:4px}
.days{touch-action:none;will-change:transform}
.week{overflow:hidden}
.ev,.ad,.tlist li,.dcol{cursor:pointer}
.ev:active,.ad:active,.tlist li:active{filter:brightness(.93)}

/* ---------- details sheet ---------- */
#sheet{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(16,22,19,.45)}
#sheet.on{display:flex}
.sheet{width:760px;max-height:84%;background:var(--card);border-radius:28px;padding:32px 40px 40px;display:flex;flex-direction:column;gap:20px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.stop{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.sbtn{height:56px;min-width:56px;border-radius:999px;border:none;background:var(--bg);color:var(--ink);font:600 22px 'Figtree',system-ui,sans-serif;display:flex;align-items:center;gap:6px;padding:0 16px;cursor:pointer}
.sbtn svg{width:26px;height:26px}
.sbar{width:72px;height:8px;border-radius:4px}
.stitle{font-size:42px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.swhen{font-size:26px;color:var(--muted);font-weight:500}
.srow{display:flex;gap:14px;align-items:flex-start;font-size:24px;line-height:1.35}
.srow svg{width:30px;height:30px;flex:none;margin-top:1px}
.snotes{font-size:23px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;min-height:0;padding-top:16px;border-top:1px solid var(--line);-webkit-user-select:text;user-select:text}
.sempty{font-size:22px;color:var(--faint)}
.slist{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.slist .ev .n{font-size:28px}
.slist .ev .t{font-size:20px}
.slist .ev .l{font-size:19px;color:#3E4A44;margin-top:2px}
.slist .ad{font-size:24px;padding:10px 16px}
.days{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px}
.dcol{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden;min-height:0}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dlabel{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.dow{font-size:22px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dnum{font-size:40px;font-weight:800;line-height:1}
.dwx{display:flex;align-items:center;gap:6px;font-size:20px;color:var(--muted);font-weight:600;white-space:nowrap}
.dwx svg{width:34px;height:34px;flex:none}
.dwx b{color:var(--ink);font-weight:700}
.devs{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:hidden}
.ev{padding:8px 12px;border-radius:12px;border-left:5px solid;flex:none}
.ev .t{font-size:17px;line-height:1.2;color:#3E4A44}
.ev .n{font-size:23px;font-weight:600;line-height:1.15;overflow-wrap:break-word}
.ad{padding:8px 12px;border-radius:10px;font-size:19px;font-weight:600;line-height:1.25;color:#26302B;align-self:flex-start;max-width:100%;overflow-wrap:break-word;flex:none}
.dempty{font-size:20px;color:var(--faint)}
.devs.tight .ad span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status{position:absolute;right:48px;bottom:12px;font-size:13px;color:var(--faint)}
.status.warn{color:#B5452B;font-weight:600}

/* ---------- portrait ---------- */
body.portrait #day{padding:48px;gap:24px}
body.portrait h1{font-size:56px}
body.portrait .clock{font-size:76px}
body.portrait .clock small{font-size:28px}
body.portrait main{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:300px minmax(0,1fr);gap:20px}
body.portrait .left{display:contents}
body.portrait .card{padding:24px}
body.portrait .wxnow svg{width:60px;height:60px}
body.portrait .temp{font-size:54px}
body.portrait .sub{font-size:18px}
body.portrait .today{gap:12px}
body.portrait .tlist{gap:10px}
body.portrait .tlist{gap:12px}
body.portrait .tlist .n{font-size:24px}
body.portrait .tlist .t{font-size:17px}
body.portrait .week{grid-column:1/-1}
body.portrait .pill{font-size:16px;padding:6px 14px;margin-bottom:8px}

/* ---------- night ---------- */
#night{flex-direction:column;justify-content:center;align-items:center;gap:56px;padding:64px;background:var(--nbg);color:var(--ntext)}
.nclock{font-size:220px;font-weight:600;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--nink);text-align:center;white-space:nowrap}
.nclock small{font-size:56px;font-weight:500;margin-left:12px;color:var(--nmuted);letter-spacing:0}
.ndate{font-size:32px;font-weight:500;color:#8A9A93;text-align:center;margin-top:8px}
.ncards{display:flex;gap:24px;justify-content:center}
.ncard{padding:24px 32px;border-radius:24px;border:1px solid var(--nline);display:flex;align-items:center;gap:18px}
.ncard svg{width:44px;height:44px;flex:none}
.ncard .k{font-size:16px;color:var(--nmuted)}
.ncard .v{font-size:26px;font-weight:600;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nhint{font-size:18px;color:#6F807A}
body.portrait .ncards{flex-direction:column;align-items:stretch}
body.portrait .nclock{font-size:190px}

/* ---------- movie hallway ---------- */
body.is-movies{background:#0C0907}
#movies{background:#0C0907;color:#F3EBDD;overflow:hidden}
#hallBg,#hall,#fog{position:absolute;inset:0}
#hall{perspective:1000px;perspective-origin:50% 50%;overflow:hidden}
#fog{pointer-events:none;background:radial-gradient(ellipse 34% 30% at 50% 50%,rgba(6,4,3,.97) 0%,rgba(6,4,3,.8) 38%,rgba(6,4,3,0) 100%)}
.mv{position:absolute;left:50%;top:50%;width:300px;height:450px;margin:-225px 0 0 -150px;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden;cursor:pointer}
.mv .fr{position:absolute;inset:-12px;border-radius:8px;background:#2A2018;border:2px solid #5A4632;box-shadow:0 0 70px rgba(255,210,140,.32)}
.mv.tagged .fr{bottom:-66px}
.mv .tag{position:absolute;left:0;right:0;bottom:-58px;height:46px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:#100A06;border:1px solid rgba(233,196,106,.55);color:#FCE7B2;font-size:20px;font-weight:800;letter-spacing:.22em;white-space:nowrap;text-shadow:0 0 12px rgba(255,200,90,.9)}
.mv .tag.soon{border-color:rgba(150,190,255,.5);color:#D6E6FF;text-shadow:0 0 12px rgba(120,170,255,.9)}
.mv.pick .fr{background:#B88A32;border-color:#F4D98E;box-shadow:0 0 90px rgba(255,196,80,.55)}
.mv.pick::after{content:'★';position:absolute;top:-34px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;background:#E9C46A;color:#3A2A08;font-size:26px;line-height:44px;text-align:center}
.lt{position:absolute;left:50%;top:50%;width:260px;height:110px;margin:-55px 0 0 -130px;border-radius:8px;background:rgba(255,232,190,.9);box-shadow:0 0 60px rgba(255,220,160,.7);will-change:transform}
.dt{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#FFB46B;box-shadow:0 0 22px 6px rgba(255,150,60,.6);will-change:transform}
.art{position:absolute;inset:0;overflow:hidden;border-radius:2px;display:flex;flex-direction:column;justify-content:space-between;padding:18px;color:#fff}
.art .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .pchip{position:absolute;left:14px;bottom:14px}
.art .pchip .svc{box-shadow:0 2px 10px rgba(0,0,0,.4)}
.art .orb{position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.14)}
.art .orb2{position:absolute;width:200px;height:200px;border-radius:50%;border:16px solid rgba(255,255,255,.16)}
.svc{position:relative;align-self:flex-start;padding:5px 11px;border-radius:999px;font-size:14px;font-weight:800;letter-spacing:.04em;color:#fff}
.art .ttl{position:relative;font-size:36px;font-weight:800;line-height:1;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.45);overflow-wrap:break-word}
.art .yr{position:relative;font-size:16px;font-weight:700;opacity:.85;margin-top:10px}
.marquee{position:absolute;top:30px;left:50%;transform:translateX(-50%);padding:10px 34px 10px 42px;border-radius:12px;border:2px solid #E9C46A;color:#FCE7B2;font-size:28px;font-weight:800;letter-spacing:.32em;white-space:nowrap;text-shadow:0 0 18px rgba(255,200,90,.85);background:rgba(20,14,8,.75);box-shadow:0 0 30px rgba(233,196,106,.25)}
.mvbar{position:absolute;left:28px;right:28px;bottom:20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.mvbar > :first-child{justify-self:start}
.mbtn.quiet{height:44px;padding:0 12px 0 6px;background:none;color:rgba(243,235,221,.38);font-size:17px;font-weight:500}
.mbtn.quiet svg{width:20px;height:20px}
.mbtn.quiet:active{color:rgba(243,235,221,.8)}
.mbtn{height:56px;padding:0 22px;border-radius:999px;border:none;background:rgba(255,255,255,.12);color:#F3EBDD;font:600 21px 'Figtree',system-ui,sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer}
.mbtn svg{width:24px;height:24px}
.mvnote{font-size:14px;color:#8F8270;text-align:center}
.mvbtn{position:absolute;left:44px;bottom:5px;height:36px;padding:0 12px 0 8px;border:none;border-radius:999px;background:none;color:var(--muted);font:600 16px 'Figtree',system-ui,sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer}
.mvbtn svg{width:24px;height:24px}
#sheet.dark{background:rgba(0,0,0,.6)}
#sheet.dark .sheet{background:#18130E;color:#F3EBDD;width:820px}
#sheet.dark .sbtn{background:rgba(255,255,255,.1);color:#F3EBDD}
#sheet.dark .swhen{color:#B8AA95}
.mdet{display:flex;gap:30px;min-height:0}
.mini{position:relative;width:210px;height:315px;flex:none;border-radius:8px;overflow:hidden}
.mini .art{padding:12px}
.mini .ttl{font-size:25px}
.mini .yr{font-size:13px}
.mini .svc{font-size:11px;padding:4px 8px}
.minfo{display:flex;flex-direction:column;gap:14px;min-width:0}
.mblurb{font-size:23px;line-height:1.45}
.mtags{font-size:19px;color:#B8AA95}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{height:50px;padding:0 20px;border-radius:999px;border:2px solid rgba(255,255,255,.2);background:none;color:#F3EBDD;font:600 20px 'Figtree',system-ui,sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chip.on{background:#F3EBDD;color:#18130E;border-color:#F3EBDD}
.chip.gold.on{background:#E9C46A;border-color:#E9C46A;color:#2A1E06}
.sscroll{display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
.slabel{font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#B8AA95;margin-top:6px}
.snote{font-size:18px;color:#9C8F7D;line-height:1.4}
body.portrait .marquee{font-size:24px}

/* ---------- setup ---------- */
#setup{flex-direction:column;justify-content:center;gap:24px;padding:96px;max-width:none}
#setup h1{white-space:normal;font-size:56px}
#setup p{font-size:24px;line-height:1.5;color:var(--muted);max-width:900px}
#setup code{font-size:20px;background:#fff;padding:2px 8px;border-radius:6px;color:var(--ink)}
#setup a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="stage">

  <section id="day" class="screen" aria-label="Family calendar">
    <header>
      <div>
        <p class="kicker">Today</p>
        <h1 id="dTitle"></h1>
      </div>
      <div class="hright">
        <p class="pill" id="countdown"></p>
        <p class="clock" id="dClock"></p>
      </div>
    </header>
    <main>
      <div class="left">
        <div class="card wx" id="wx"></div>
        <div class="card today">
          <h2>Today's plan</h2>
          <div id="todayList"></div>
        </div>
      </div>
      <section class="week">
        <div class="weekhead"><h2 id="weekTitle">This week</h2><div class="dots" id="dots" aria-hidden="true"></div></div>
        <div class="days" id="days"></div>
      </section>
    </main>
    <p class="status" id="status"></p>
    <button class="mvbtn" data-act="movies" aria-label="Movie hallway"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/></svg>Movies</button>
  </section>

  <section id="movies" class="screen" aria-label="Movie hallway">
    <svg id="hallBg" aria-hidden="true"></svg>
    <div id="hall"></div>
    <div id="fog"></div>
    <p class="marquee">NOW SHOWING</p>
    <div class="mvbar">
      <button class="mbtn quiet" data-act="mv-exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Calendar</button>
      <p class="mvnote" id="mvNote"></p>
      <span></span>
    </div>
  </section>

  <div id="sheet" role="dialog" aria-modal="true"><div class="sheet" id="sheetBox"></div></div>

  <section id="night" class="screen" aria-label="Night clock">
    <div>
      <p class="nclock" id="nClock"></p>
      <p class="ndate" id="nDate"></p>
    </div>
    <div class="ncards" id="nCards"></div>
    <p class="nhint" id="nHint"></p>
  </section>

  <section id="setup" class="screen">
    <h1>Almost there</h1>
    <p>This page needs the link to your calendar relay. Add it to the address like this:<br>
      <code>…/index.html?src=https://script.google.com/macros/s/…/exec</code></p>
    <p>Just want to look around? <a href="?demo=1">Open the demo</a> with sample events.</p>
  </section>

</div>

<script>
(function () {
  'use strict';

  // ---------- settings (all overridable in the URL) ----------
  var P = new URLSearchParams(location.search);
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem('wc_' + k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('wc_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  var DEMO = P.has('demo');
  if (P.get('src')) store.set('src', P.get('src'));
  var SRC = DEMO ? null : (P.get('src') || store.get('src'));
  var LAT = parseFloat(P.get('lat')) || 38.7796;     // Roseville, CA 95747
  var LON = parseFloat(P.get('lon')) || -121.3680;
  var nightParts = (P.get('night') || '22-6').split('-').map(Number);
  var NIGHT_START = nightParts[0], NIGHT_END = nightParts[1]; // 24h clock; same number = never
  var FORCE = P.get('force'); // 'day' | 'night' for testing
  var EVENTS_EVERY = 10 * 60e3, WEATHER_EVERY = 30 * 60e3, WAKE_FOR = 90e3;

  var S = { events: [], eventsAt: null, through: null, wx: null, err: false, wakeUntil: 0, bootAt: Date.now(), page: 0, sheetDay: null };
  var IDLE_RESET = 90e3, idleTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  // ---------- date helpers ----------
  function sod(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseYmd(s) { var a = s.split('-'); return new Date(+a[0], a[1] - 1, +a[2]); }
  var DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function hm(d) { var h = d.getHours() % 12 || 12; return h + ':' + String(d.getMinutes()).padStart(2, '0'); }

  // ---------- events ----------
  function normalize(list) {
    return (list || []).map(function (e) {
      var o = { title: e.title || '(No title)', color: e.color || '#2F6F5E', allDay: !!e.allDay, loc: e.location || '', notes: e.notes || '' };
      if (o.allDay) { o.s = parseYmd(e.startDate); o.e = parseYmd(e.endDate || e.startDate); if (o.e <= o.s) o.e = addDays(o.s, 1); }

  }

  function loadEvents() {
    if (DEMO) { S.events = normalize(demoEvents()); S.eventsAt = new Date(); render(); return; }
    if (!SRC) return;
    var url = SRC + (SRC.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now();
    fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {

  // ---------- weather (Open-Meteo, no key needed) ----------
  function loadWeather() {
    if (DEMO) { S.wx = demoWeather(); render(); return; }
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,weather_code,is_day' +
      '&hourly=temperature_2m,weather_code,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&temperature_unit=fahrenheit&timezone=auto&forecast_days=8';
    clearTimeout(S.wxRetry);
    fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
      if (!d || !d.current) throw new Error('bad weather');

    }).catch(function () {

      S.wxErr = true; render(); S.wxRetry = setTimeout(loadWeather, 2 * 60e3);
    });
  }

  function wxInfo(code, isDay) {

    if (c === 1) return { i: night ? 'moon' : 'sun', l: 'Mostly clear' };
    if (c === 2) return { i: night ? 'pcnight' : 'partly', l: 'Partly cloudy' };
    if (c === 3) return { i: 'cloud', l: 'Cloudy' };
    if (c === 45 || c === 48) return { i: 'fog', l: 'Fog' };
    if (c >= 51 && c <= 57) return { i: 'rain', l: 'Drizzle' };
    if (c >= 61 && c <= 67) return { i: 'rain', l: 'Rain' };
    if (c >= 71 && c <= 77) return { i: 'snow', l: 'Snow' };

  }
  function dailyFor(day) {

  // ---------- holidays countdown ----------
  function nthDow(y, m, dow, n) { var d = new Date(y, m, 1); var off = (dow - d.getDay() + 7) % 7; return new Date(y, m, 1 + off + (n - 1) * 7); }

    return [
      ['New Year’s Day', new Date(y, 0, 1)], ['Valentine’s Day', new Date(y, 1, 14)], ['St. Patrick’s Day', new Date(y, 2, 17)],
      ['Mother’s Day', nthDow(y, 4, 0, 2)], ['Father’s Day', nthDow(y, 5, 0, 3)], ['the 4th of July', new Date(y, 6, 4)],
      ['Halloween', new Date(y, 9, 31)], ['Thanksgiving', nthDow(y, 10, 4, 4)], ['Christmas', new Date(y, 11, 25)]

  function countdown(now) {

      var days = Math.round((list[i][1] - t) / 864e5);
      if (days < 0) continue;

      if (days === 0) return 'Happy ' + list[i][0].replace(/^the /, '') + '!';
      return list[i][0].charAt(0).toUpperCase() + list[i][0].slice(1) + (days === 1 ? ' is tomorrow' : ' in ' + days + ' days');
    }
    return '';
  }

  // ---------- rendering ----------
  function clockHtml(d) { return hm(d) + '<small>' + ap(d) + '</small>'; }

  // trims items from a box until it fits, adding "+N more"
  function fit(box, pick) {
    var hidden = 0, more = null;
    while (box.scrollHeight > box.clientHeight + 1) {
      var el = pick(box);
      if (!el) break;
      el.parentNode.removeChild(el); hidden++;
      if (!more) { more = document.createElement('p'); more.className = 'more'; box.appendChild(more); }
      more.textContent = '+' + hidden + ' more';
    }
  }

  function isNight(now) {
    if (FORCE === 'night') return true;
    if (FORCE === 'day') return false;
    if (now.getTime() < S.wakeUntil) return false;
    if (NIGHT_START === NIGHT_END) return false;
    var h = now.getHours();
    return NIGHT_START > NIGHT_END ? (h >= NIGHT_START || h < NIGHT_END) : (h >= NIGHT_START && h < NIGHT_END);
  }

  function render() {
    var now = new Date();
    var setupNeeded = !DEMO && !SRC;
    $('setup').classList.toggle('on', setupNeeded);
    if (setupNeeded) { $('day').classList.remove('on'); $('night').classList.remove('on'); return; }
    var night = isNight(now);
    if (night && S.moviesOn) { S.moviesOn = false; haltHall(); closeSheet(); }   // night clock wins
    var movies = !night && S.moviesOn;
    document.body.classList.toggle('is-night', night);
    document.body.classList.toggle('is-movies', movies);
    $('day').classList.toggle('on', !night && !movies);
    $('night').classList.toggle('on', night);
    $('movies').classList.toggle('on', movies);
    if (night) renderNight(now); else if (!movies) renderDay(now);
  }

  function renderDay(now) {
    $('dTitle').textContent = DOW[now.getDay()] + ', ' + MON[now.getMonth()].slice(0, 3) + ' ' + now.getDate();
    $('dClock').innerHTML = clockHtml(now);
    $('countdown').textContent = countdown(now);

    // weather card
    var w = S.wx, wxHtml;
    if (w && w.current) {
      var cur = wxInfo(w.current.weather_code, w.current.is_day), today = dailyFor(now);
      var hrs = '', h = w.hourly, start = -1;
      if (h) {
        var nextHour = new Date(now); nextHour.setMinutes(0, 0, 0); nextHour.setHours(nextHour.getHours() + 1);
        var key = ymd(nextHour) + 'T' + String(nextHour.getHours()).padStart(2, '0') + ':00';
        start = h.time.indexOf(key);
      }
      if (start > -1) {
        for (var k = 0; k < 4; k++) {
          var j = start + k * 3; if (j >= h.time.length) break;
          var hi = wxInfo(h.weather_code[j], h.is_day[j]);
          hrs += '<li><span>' + shortHour(+h.time[j].slice(11, 13)) + '</span>' + icon(hi.i, iconColor(hi.i)) + '<b>' + Math.round(h.temperature_2m[j]) + '°</b></li>';
        }
      }
      var stale = S.wxAt && now - S.wxAt > 2 * 3600e3;
      wxHtml = '<div class="wxnow">' + icon(cur.i, iconColor(cur.i)) +
        '<div><p class="temp">' + Math.round(w.current.temperature_2m) + '°</p><p class="sub">' + esc(cur.l) +
        (today ? ' · H ' + today.max + '° L ' + today.min + '°' : '') + '</p></div></div>' +
        (hrs ? '<ul class="hours">' + hrs + '</ul>' : '') +
        (stale ? '<p class="wxage">Weather as of ' + fmtTime(S.wxAt) + (sameDay(S.wxAt, now) ? '' : ' ' + (S.wxAt.getMonth() + 1) + '/' + S.wxAt.getDate()) + '</p>' : '');
    } else {
      wxHtml = '<p class="empty">' + (S.wxErr ? 'Couldn’t reach the weather. Retrying…' : 'Weather loading…') + '</p>';
    }
    $('wx').innerHTML = wxHtml;

    // today's plan
    var todays = eventsOn(now), allDay = todays.filter(function (e) { return e.allDay; }), timed = todays.filter(function (e) { return !e.allDay; });
    var html = '';
    if (allDay.length) html += '<div class="alldays">' + allDay.map(function (e) { return '<span class="ad" data-i="' + S.events.indexOf(e) + '" style="background:' + tint(e.color, .2) + '">' + esc(e.title) + '</span>'; }).join('') + '</div>';
    if (timed.length) {
      html += '<ul class="tlist">' + timed.map(function (e) {
        var past = e.e <= now && +e.e !== +e.s, current = e.s <= now && e.e > now;
        var t = e.s < sod(now) ? 'until ' + fmtTime(e.e) : fmtRange(e.s, e.e);
        return '<li data-i="' + S.events.indexOf(e) + '" class="' + (past ? 'past' : '') + '"><span class="bar" style="background:' + esc(e.color) + '"></span><div><p class="t">' + t +
          (current ? '<span class="now">NOW</span>' : '') + '</p><p class="n">' + esc(e.title) + '</p></div></li>';
      }).join('') + '</ul>';
    }
    if (!todays.length) html = '<p class="empty">' + (S.eventsAt ? 'Nothing on the calendar today.' : 'Loading the calendar…') + '</p>';
    $('todayList').innerHTML = html;
    // if it doesn't fit, drop finished events first, then the latest ones
    fit($('todayList'), function (box) {
      var ul = box.querySelector('.tlist');
      return ul && (ul.querySelector('li.past') || (ul.children.length > 1 ? ul.lastElementChild : null));
    });

    // week
    var daysHtml = '', first = 1 + S.page * 6;
    S.page = Math.min(S.page, maxPage(now));
    first = 1 + S.page * 6;
    $('weekTitle').textContent = S.page === 0 ? 'This week' : rangeLabel(addDays(sod(now), first), addDays(sod(now), first + 5));
    var dots = '', mp = maxPage(now);
    for (var k = 0; k <= mp; k++) dots += '<i' + (k === S.page ? ' class="on"' : '') + '></i>';
    $('dots').innerHTML = dots;
    $('dots').classList.toggle('many', mp > 9);
    for (var d = first; d < first + 6; d++) {
      var day = addDays(sod(now), d), evs = eventsOn(day), f = dailyFor(day), wi = f ? wxInfo(f.code, 1) : null;
      var items = evs.map(function (e) {
        if (e.allDay) return '<p class="ad" data-i="' + S.events.indexOf(e) + '" style="background:' + tint(e.color, .2) + '"><span>' + esc(e.title) + '</span></p>';
        var t = e.s < day ? 'until ' + fmtTime(e.e) : fmtTime(e.s);
        return '<div class="ev" data-i="' + S.events.indexOf(e) + '" style="background:' + tint(e.color, .14) + ';border-left-color:' + esc(e.color) + '"><p class="t">' + t + '</p><p class="n">' + esc(e.title) + '</p></div>';
      }).join('');
      if (!evs.length) items = '<p class="dempty">Nothing planned</p>';
      daysHtml += '<div class="dcol" data-day="' + ymd(day) + '"><div class="dhead"><p class="dlabel"><span class="dow">' + DOW[day.getDay()].slice(0, 3) + '</span><span class="dnum">' + day.getDate() + '</span></p>' +
        (f ? '<div class="dwx">' + icon(wi.i, iconColor(wi.i)) + '<span><b>' + f.max + '°</b> ' + f.min + '°</span></div>' : '') +

  function renderNight(now) {

    var cards = [], w = S.wx;

    if (w && w.current) {
      var cur = wxInfo(w.current.weather_code, 0);

      var f = dailyFor(nextDay);
      if (f) { var fi = wxInfo(f.code, 1); cards.push([icon(fi.i, iconColor(fi.i, true)), morning ? 'Today' : 'Tomorrow', fi.l + ' · ' + f.max + '° / ' + f.min + '°']); }
    }

  }

  // ---------- layout: scale the fixed stage to fit the screen ----------
  function layout() {

    $('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';

    if (S.moviesOn) buildHall();
  }

  // ---------- demo data ----------

    }

    var kids = '#039BE5', fam = '#33B679', mom = '#F4511E', dad = '#8E24AA';
    return [

  }
  function demoWeather() {
    var t = sod(new Date()), hourly = { time: [], temperature_2m: [], weather_code: [], is_day: [] }, daily = { time: [], weather_code: [], temperature_2m_max: [], temperature_2m_min: [], precipitation_probability_max: [] };
    var codes = [0, 0, 2, 3, 61, 1, 0, 0], hi = [74, 73, 70, 66, 61, 67, 71, 72], lo = [49, 50, 51, 52, 50, 48, 47, 49];
    for (var d = 0; d < 8; d++) {
      var day = addDays(t, d);
      daily.time.push(ymd(day)); daily.weather_code.push(codes[d]); daily.temperature_2m_max.push(hi[d]); daily.temperature_2m_min.push(lo[d]); daily.precipitation_probability_max.push(codes[d] === 61 ? 70 : 5);
      for (var h = 0; h < 24; h++) {

  function showMovie(i) {
    var m = movieList()[i]; if (!m) return;
    MV.paused = true; haltHall();
    var pick = isPick(m);
    openSheet('<div class="stop"><span></span>' + closeBtn() + '</div>' +
      '<div class="mdet"><div class="mini">' + posterArt(m) + '</div><div class="minfo">' +
      '<p class="stitle">' + esc(m.title) + '</p>' +
      (m.addedBy ? '<p class="mtags">Added by ' + esc(m.addedBy) + '</p>' : '') +
      '<p class="swhen">' + [m.year, m.rating, m.type === 'show' ? 'Series' : '', m.mins ? Math.floor(m.mins / 60) + 'h ' + (m.mins % 60) + 'm' : ''].filter(Boolean).join(' · ') + '</p>' +
      '<p>' + svcChip(m) + '</p>' +
      (availLine(m) ? '<p class="mtags" style="color:' + (m.status === 'soon' ? '#BFD7FF' : '#E9C46A') + '">' + esc(availLine(m)) + '</p>' : '') +
      (m.blurb ? '<p class="mblurb">' + esc(m.blurb) + '</p>' : '') +
      '<p class="mtags">' + esc((m.genres || []).join(' · ')) + '</p>' +
      '<div class="chips"><button class="chip gold' + (pick ? ' on' : '') + '" data-act="mv-pin" data-mvi="' + i + '">★ ' + (pick ? 'Our pick' : 'Make it our pick') + '</button></div>' +
      '</div></div>', true);
  }
  function showPrefs() {
    MV.paused = true; haltHall();
    var p = mvPrefs(), n = mvPicks().length;
    var svcs = Object.keys(SVC).map(function (k) { return '<button class="chip' + (p.svc[k] ? ' on' : '') + '" data-act="mv-svc" data-k="' + k + '">' + SVC[k].name + '</button>'; }).join('');
    var gens = GENRES.map(function (g) { return '<button class="chip' + (p.genres.indexOf(g) > -1 ? ' on' : '') + '" data-act="mv-genre" data-k="' + g + '">' + g + '</button>'; }).join('');
    openSheet('<div class="stop"><p class="stitle" style="font-size:34px">What to show</p>' + closeBtn() + '</div><div class="sscroll">' +
      '<p class="slabel">Services</p><div class="chips">' + svcs + '</div>' +
      '<p class="slabel">Availability</p><div class="chips"><button class="chip' + (p.nowOnly ? ' on' : '') + '" data-act="mv-now">Streaming now only</button></div>' +
      '<p class="slabel">Genres</p><div class="chips">' + gens + '</div><p class="snote">Pick none to show every genre.</p>' +
      '<p class="slabel">Our picks</p><div class="chips"><button class="chip gold' + (p.picksOnly ? ' on' : '') + '" data-act="mv-picks">★ Only show our picks (' + n + ')</button></div>' +
      '<p class="snote">Tap a poster and choose “Make it our pick” to give it a gold frame. Picks show up twice as often.</p>' +
      (MV.fallback ? '<p class="snote" style="color:#E9C46A">Nothing matches these choices, so the hallway is showing everything.</p>' : '') +
      '</div>', true);
  }
  function mvAction(a, el) {
    var p = mvPrefs(), k = el.getAttribute('data-k');
    if (a === 'mv-svc') { p.svc[k] = !p.svc[k]; store.set('mvprefs', p); refillPosters(); showPrefs(); }
    else if (a === 'mv-genre') { var gi = p.genres.indexOf(k); if (gi > -1) p.genres.splice(gi, 1); else p.genres.push(k); store.set('mvprefs', p); refillPosters(); showPrefs(); }
    else if (a === 'mv-now') { p.nowOnly = !p.nowOnly; store.set('mvprefs', p); refillPosters(); showPrefs(); }
    else if (a === 'mv-picks') { p.picksOnly = !p.picksOnly; store.set('mvprefs', p); refillPosters(); showPrefs(); }
    else if (a === 'mv-pin') {
      var i = +el.getAttribute('data-mvi'), m = movieList()[i], picks = mvPicks(), at = picks.indexOf(m.title);
      if (at > -1) picks.splice(at, 1); else picks.push(m.title);
      store.set('mvpicks', picks); MV.deck = [];
      MV.items.forEach(function (it) { if (it.m === m) it.el.classList.toggle('pick', at < 0); });
      showMovie(i);
    }
    else if (a === 'mv-prefs') showPrefs();
    else if (a === 'mv-exit') stopMovies();
    else if (a === 'movies') startMovies();
  }

  // ---------- keep it alive ----------
  var wakeLock = null;
  function keepAwake() {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
  }

  $('stage').addEventListener('click', function (ev) {
    if (document.body.classList.contains('is-night') && FORCE !== 'night') { S.wakeUntil = Date.now() + WAKE_FOR; render(); return; }
    if (Date.now() < S.swipedAt + 400) return;
    // after a minute and a half of no taps, close details and go back to this week
    clearTimeout(idleTimer); idleTimer = setTimeout(onIdle, IDLE_RESET);
    var t = ev.target, act = t.closest('[data-act]'), item = t.closest('[data-i]'), day = t.closest('[data-day]'), poster = t.closest('[data-mv]');
    if (act) {
      var a = act.getAttribute('data-act');
      if (a.indexOf('mv') === 0 || a === 'movies') mvAction(a, act);
      else if (a === 'close') closeSheet();
      else if (a === 'back') showDay(S.sheetDay);
    }
    else if (S.moviesOn) {
      // in the hallway: a poster opens its details, anywhere else goes back to the calendar
      if (poster) showMovie(+poster.getAttribute('data-mv'));
      else if (t === $('sheet')) closeSheet();
      else if (!t.closest('#sheet')) stopMovies();
    }
    else if (item) { var inSheet = !!t.closest('#sheet'); if (!inSheet) S.sheetDay = null; showEvent(+item.getAttribute('data-i'), inSheet); }
    else if (day) showDay(day.getAttribute('data-day'));
    else if (t === $('sheet')) closeSheet();
    else if (!t.closest('#sheet')) loadEvents();
  });
  $('stage').addEventListener('pointerdown', function () { S.lastTouch = Date.now(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { keepAwake(); loadEvents(); loadWeather(); } });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 300); });

  // start from cached data so the screen is never blank
  var cachedE = !DEMO && store.get('events'), cachedW = !DEMO && store.get('wx');
  if (cachedE) { S.events = normalize(cachedE.events); S.eventsAt = new Date(cachedE.at); S.through = cachedE.through ? parseYmd(cachedE.through) : null; }
  // only reuse saved weather if it was for this location
  if (cachedW && cachedW.d && Math.abs(cachedW.lat - LAT) < 0.02 && Math.abs(cachedW.lon - LON) < 0.02) { S.wx = cachedW.d; S.wxAt = new Date(cachedW.at); }

  layout();
  // re-measure once the font has loaded so the fitting is accurate
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  loadEvents(); loadWeather(); keepAwake();
  setInterval(function () {
    // after 15 quiet minutes in the day, drift into the movie hallway
    if (MOVIES_AUTO && !S.moviesOn && !$('sheet').classList.contains('on') && Date.now() - S.lastTouch > MOVIE_IDLE) startMovies();
    render();
  }, 20e3);
  if (FORCE === 'movies') startMovies();
  setInterval(loadEvents, EVENTS_EVERY);
  setInterval(loadWeather, WEATHER_EVERY);
  // fresh start every night around 3 am
  setInterval(function () { var n = new Date(); if (n.getHours() === 3 && Date.now() - S.bootAt > 2 * 3600e3) location.reload(); }, 5 * 60e3);
})();
</script>
</body>
</html>
